services:
    cravex-postgres:
      image: postgis/postgis:16-3.4
      container_name: cravex-postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: cravex
      ports:
        - "5432:5432"
      volumes:
        - cravex-pgdata:/var/lib/postgresql/data

    cravex-redis:
      image: redis:7
      container_name: cravex-redis
      restart: unless-stopped
      command: redis-server --requirepass ${REDIS_PASSWORD}
      ports:
        - "6379:6379"
      volumes:
        - cravex-redisdata:/data


    cravex-rabbitmq:
      image: rabbitmq:3-management
      container_name: cravex-rabbitmq
      restart: unless-stopped
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      ports:
        - "5672:5672"     # AMQP — Spring Boot connects here
        - "15672:15672"   # Management UI
      volumes:
        - cravex-rabbitmqdata:/var/lib/rabbitmq


volumes:
  cravex-pgdata:
  cravex-redisdata:
  cravex-rabbitmqdata: